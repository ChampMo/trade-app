[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeapp"
version = "0.0.1"
description = "MT5 trading core controlled by a desktop app. Build-time AI = Claude Code, run-time AI = DeepSeek (bounded)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "fastapi>=0.110",
  # The websocket event stream needs a protocol implementation, which plain uvicorn does not ship.
  # Starlette's TestClient does its own, so the tests passed while the real server refused every
  # upgrade — caught only by opening the UI against a running core.
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
# The official MetaTrader5 package only exists for Windows. Tests never need it (they use FakeBroker).
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
dev = ["pytest>=8", "ruff>=0.5", "respx>=0.21"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # `ruff format` wraps code; long literal strings are allowed

[tool.ruff.lint.per-file-ignores]
# FastAPI declares request bodies as parameter defaults; that is the framework's idiom, not a bug.
"src/tradeapp/api.py" = ["B008"]
