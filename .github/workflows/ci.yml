name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  ui:
    # The UI has its own failure modes and its own tests. It gets its own job so a broken
    # dashboard cannot hide behind a green core, or the other way round.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # --ignore-scripts skips Electron's ~100 MB binary download. CI runs vitest and a vite
      # build; neither needs the desktop shell, and installing it is the only part of this job
      # that depends on the network reaching a release server.
      - run: node -v && npm -v && pwd && ls -la
      # Actions logs need a token to read, but annotations do not: on failure the message is
      # re-emitted as one so it can be read from outside.
      - name: install
        run: |
          set +e
          npm ci --ignore-scripts > install.log 2>&1
          code=$?
          cat install.log
          if [ $code -ne 0 ]; then
            echo "::error::$(tr '
' '  ' < install.log | tail -c 900)"
          fi
          exit $code
      - run: npm test
      - run: npm run build
